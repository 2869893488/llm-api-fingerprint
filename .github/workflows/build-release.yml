name: Build and Release Binaries

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach binaries to (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: llm-api-fingerprint-windows-x64.zip
            binary_name: llm-api-fingerprint.exe
          - os: ubuntu-latest
            artifact_name: llm-api-fingerprint-linux-x64.tar.gz
            binary_name: llm-api-fingerprint
          - os: macos-latest
            artifact_name: llm-api-fingerprint-macos-x64.tar.gz
            binary_name: llm-api-fingerprint

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --name llm-api-fingerprint --add-data "config.example.json;." run_fingerprint.py
          New-Item -ItemType Directory -Force -Path dist_package
          Copy-Item dist/llm-api-fingerprint.exe dist_package/
          Copy-Item config.example.json dist_package/
          Copy-Item README.md dist_package/
          Compress-Archive -Path dist_package/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Build with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --name llm-api-fingerprint --add-data "config.example.json:." run_fingerprint.py
          mkdir -p dist_package
          cp dist/llm-api-fingerprint dist_package/
          cp config.example.json dist_package/
          cp README.md dist_package/
          tar -czvf ${{ matrix.artifact_name }} -C dist_package .

      - name: Determine Release Tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: steps.get_tag.outputs.tag != ''
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
